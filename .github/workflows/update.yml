name: Mise à jour du calendrier SLUC

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mettre à jour et publier
        env:
          ORIGINE: GitHub
        run: |
          git config user.name "sluc-calendrier-bot"
          git config user.email "actions@users.noreply.github.com"
          bash mettre-a-jour.sh
